name: Bug report
description: Report something that is broken or behaving unexpectedly
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Parterre. Remove credentials, personal data,
        and sensitive page content from logs and screenshots before attaching them.

  - type: input
    id: version
    attributes:
      label: Parterre version
      description: Enter the release version or commit SHA.
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Include the terminal name and version when known.
      placeholder: Ghostty 1.2
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: Codex / auto
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - curl installer
        - source checkout
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Run ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Attach anything useful after removing secrets and personal data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, personal data, and sensitive page content.
          required: true
        - label: This is not a security vulnerability.
          required: true
