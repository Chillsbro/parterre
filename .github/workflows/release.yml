name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test tests/unit tests/tui
      - run: bun run build
      - name: Build release archive
        run: |
          mkdir release
          cp -R bin dist package.json bun.lock README.md LICENSE install.sh release/
          printf '%s\n' "$GITHUB_REF_NAME" > release/VERSION
          tar -czf parterre.tar.gz -C release .
      - uses: softprops/action-gh-release@v2
        with:
          files: parterre.tar.gz
          generate_release_notes: true
